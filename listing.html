<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Объявление — GeoBazar</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="ui.js"></script><script src="auth.js"></script>
<style>#listingMap{height:360px;border-radius:22px;border:1px solid var(--border);margin-top:14px}</style>
</head>
<body><script>header();</script>
<main>
<div class="layout">
<section class="panel">
<div class="page-title"><h1 data-listing-title>Объявление</h1><span class="badge">VIP</span></div>
<img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a?q=80&w=1200&auto=format&fit=crop" style="width:100%;border-radius:22px">
<h2>Описание</h2><p data-listing-description>Описание объявления</p>
<div class="grid-4"><div class="stat"><p>Город</p><h2 data-listing-city>—</h2></div><div class="stat"><p>Просмотры</p><h2>0</h2></div><div class="stat"><p>Рейтинг</p><h2>4.9</h2></div><div class="stat"><p>Статус</p><h2>Active</h2></div></div>
<h2>Карта</h2><div id="listingMap"></div>
</section>
<aside>
<div class="panel"><h1 data-listing-price>Цена</h1><button class="btn btn-blue" style="width:100%">💬 Написать</button><button class="btn btn-orange" style="width:100%;margin-top:10px">📞 Позвонить</button><button class="btn btn-light" style="width:100%;margin-top:10px" onclick="toggleFavorite(qs('id'))">❤️ В избранное</button></div>
<div class="panel"><h2>Продавец ✅</h2><p>⭐ 4.9 · Проверенный</p></div>
</aside>
</div>
</main>
<script>authModal();</script><script>footer();</script>
<script src="app.js"></script><script src="map.js"></script><script>loadListingDetail();</script>
</body></html>
