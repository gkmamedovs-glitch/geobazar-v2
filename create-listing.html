<!DOCTYPE html><html lang='ru'><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="ui.js"></script><script src="auth.js"></script><title>Подать объявление</title></head><body><script>header();</script><main><section class='hero-mini'><h1>Подать объявление</h1><p>Параметры, адрес и точка на карте</p></section><section class='panel'><div class='form-grid'><div class='field full'><label>Заголовок</label><input id='listingTitle'></div><div class='field'><label>Категория</label><select id='listingCategory'><option>Авто</option><option>Недвижимость</option></select></div><div class='field'><label>Цена</label><input id='listingPrice' type='number'></div><div class='field'><label>Валюта</label><select id='listingCurrency'><option>GEL</option><option>USD</option></select></div><div class='field'><label>Город</label><input id='listingCity'></div><div class='field'><label>Адрес</label><input id='listingAddress'></div><div class='field'><label>Latitude</label><input id='listingLatitude' readonly></div><div class='field'><label>Longitude</label><input id='listingLongitude' readonly></div><div class='field full'><label>Описание</label><textarea id='listingDescription'></textarea></div><div class='field full'><label>Точка на карте</label><div id='createMap'></div></div></div><button class='btn btn-orange' onclick='createListing()'>Опубликовать</button></section></main><script src='map.js'></script><script>initCreateListingMap();</script><script>authModal();</script><script>footer();</script><script src="app.js"></script><script src="support.js"></script></body></html>
